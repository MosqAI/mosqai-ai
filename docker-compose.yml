services:
  ai-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mosqai-ai-container
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      MODEL_PATH: /app/models/yolov8n_mosquito.onnx
    volumes:
      - ./models:/app/models:ro
    restart: unless-stopped
